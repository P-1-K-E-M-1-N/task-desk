name: CI

on:
  push:
    branches: [dev, main, release]
  pull_request:

# The workflow only reads the code; it can't write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Exactly the locked versions, and no package runs its own install script.
      - run: npm ci --ignore-scripts
      # Electron itself, checked against the checksums in its package.
      - run: node node_modules/electron/install.js

      - run: npm run lint

      - run: npm run format:check

      # The tests that need no AI app: they launch Electron with a temporary data
      # folder and a pretend AI (test/fake-claude.js). See test/run.js.
      - run: npm test
        env:
          TASKDESK_NO_UPDATE: '1'

      - name: Keep the screenshots when something fails
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-screenshots
          path: test/shots/
          if-no-files-found: ignore
