name: An idea
description: Something Task Desk could do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation you're in when you wish Task Desk did this.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like it to do
  - type: textarea
    id: today
    attributes:
      label: How you handle it today
