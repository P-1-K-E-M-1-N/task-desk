<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Task Desk</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { background: transparent; }
  /* The border is the frame material (paper, wood, glass…), the header sits on it too. */
  .panel {
    position: absolute; inset: 8px; display: flex; flex-direction: column; overflow: hidden;
    border: var(--frame-w) solid transparent; border-radius: 18px;
    background: linear-gradient(var(--bg), var(--bg)) padding-box, var(--frame);
    background-origin: border-box; /* No soft shadow or wide glow here: the see-through window is only 8px bigger than the box,
       so they would be cut off at its edge and show as a faint grey box. A thin ring fits. */
    box-shadow: 0 0 0 1px rgba(0,0,0,.16);
    outline: var(--stitch); outline-offset: calc(var(--frame-w) / -2 - 1px);
    animation: var(--frame-anim);
  }
  /* Moving frames: the header gets a plain bar so it doesn't freeze a copy of the frame. */
  :root[data-motion] header { background: var(--bg-2); --bar-ink: var(--ink-2); }
  .unlocked footer { padding-right: 70px; }
  /* default-AI picker in the footer */
  footer { align-items: center; gap: 8px; }
  .aipick { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px 0 6px; margin-left: auto; border: 1px solid var(--line-2); border-radius: 999px;
    background: var(--surface); color: var(--ink-2); font: inherit; font-size: 10.5px; font-weight: 650; cursor: pointer; white-space: nowrap; }
  .aipick:hover { color: var(--ink); border-color: var(--clay); }
  .aipick svg.i { width: 11px; height: 11px; }
  .aipick .chev { opacity: .6; }
  footer .keys { white-space: nowrap; }
  .narrow footer .keys { display: none; }
  :root:not([data-material=paper]) header { background: var(--bar); color: var(--bar-ink); margin: 0 0 8px; }
  :root:not([data-material=paper]) header .brand, :root:not([data-material=paper]) header .iconbtn { color: var(--bar-ink); }
  :root:not([data-material=paper]) header .iconbtn:hover { background: rgba(127,127,127,.18); }
  :root[data-material=neon] header { background: var(--bg-2); }
  .panel::before {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 160px; pointer-events: none;
    background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--clay) 13%, transparent), transparent 60%);
  }
  header { position: relative; display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 4px 0 12px; flex: none; }
  .brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-weight: 650; font-size: 12px; letter-spacing: .01em; color: var(--ink-2); }
  .brand img { width: 18px; height: 18px; border-radius: 5px; }
  /* The empty space in the header is where you grab the box to move it, so it never shrinks to nothing. */
  header .sp { flex: 1; min-width: 40px; align-self: stretch; }
  header .iconbtn { width: 27px; flex: none; }
  header .pill { margin-left: 4px; }
  .hero { position: relative; padding: 4px 18px 12px; flex: none; }
  .hello { color: var(--ink-3); font-size: 12px; font-weight: 500; }
  .big { display: flex; align-items: baseline; gap: 10px; margin-top: 2px; }
  .big b { font-family: var(--serif); font-weight: 520; font-size: 30px; letter-spacing: -.02em; font-variation-settings: 'opsz' 72; }
  .big span { color: var(--ink-2); font-size: 13px; font-weight: 550; }
  .meter { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--ink-3); font-size: 11px; font-weight: 550; }
  .meter .bar { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .meter .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--clay), var(--clay-2)); transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .chips { position: relative; display: flex; gap: 6px; padding: 0 14px 10px; overflow-x: auto; flex: none; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; flex: none;
    border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); font-size: 11.5px; font-weight: 600;
    cursor: pointer; text-transform: capitalize; transition: all .15s;
  }
  .chip em { font-style: normal; color: var(--ink-3); font-weight: 600; }
  .chip:hover { color: var(--ink); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .chip.on em { color: color-mix(in srgb, var(--bg) 65%, transparent); }
  .list { position: relative; flex: 1; overflow-y: auto; padding: 2px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
  .card {
    position: relative; display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 12px 11px 11px; text-align: left;
    border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; box-shadow: var(--shadow-sm);
    transition: transform .12s, box-shadow .15s, border-color .15s; animation: rise .28s cubic-bezier(.2,.8,.2,1) both;
  }
  .still .card { animation: none; }
  .card:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: var(--line-2); }
  .card:active { transform: translateY(0); }
  .card.urgent::before { content: ''; position: absolute; left: -1px; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--clay); }
  .card.low { background: transparent; box-shadow: none; border-style: dashed; }
  .card.low .ttl { color: var(--ink-2); font-weight: 550; }
  .card .body { flex: 1; min-width: 0; }
  .ttl { font-size: 13.3px; font-weight: 620; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; align-items: center; gap: 7px; margin-top: 4px; font-size: 11.3px; color: var(--ink-3); font-weight: 520; white-space: nowrap; overflow: hidden; }
  .meta > * { flex: none; }
  .meta .lane { display: inline-flex; align-items: center; gap: 5px; text-transform: capitalize; flex: 0 1 auto; min-width: 0; }
  .meta .lane span.nm { overflow: hidden; text-overflow: ellipsis; }
  .meta .sep { opacity: .5; }
  .quick { display: inline-flex; align-items: center; gap: 2px; color: var(--ok); font-weight: 650; }
  .quick svg.i { width: 11px; height: 11px; fill: currentColor; stroke: none; }
  .right { flex: none; display: grid; place-items: center; width: 26px; }
  .ring { width: 24px; height: 24px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 3; }
  .ring .bg { stroke: var(--surface-2); }
  .ring .fg { stroke: var(--ok); stroke-linecap: round; transition: stroke-dashoffset .4s; }
  .drafting { color: var(--clay); animation: pulse 1.4s infinite; }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .empty { margin: auto; text-align: center; padding: 30px 20px; color: var(--ink-2); }
  .empty b { display: block; font-family: var(--serif); font-size: 22px; font-weight: 500; color: var(--ink); margin: 10px 0 4px; }
  .empty .tile { margin: 0 auto; width: 44px; height: 44px; border-radius: 14px; --tc: var(--ok); }
  footer { position: relative; display: flex; justify-content: space-between; padding: 7px 16px 9px; font-size: 10.5px; color: var(--ink-3); border-top: 1px solid var(--line); flex: none; font-weight: 520; }
  kbd { font-family: var(--sans); font-size: 10px; padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line-2); background: var(--surface); }

  /* collapsed bar */
  .bar-mode header { height: 100%; padding-left: 10px; }
  .bar-mode .hero, .bar-mode .chips, .bar-mode .list, .bar-mode footer { display: none; }
  .bar-mode .brand .lbl { display: none; }
  .barsum { display: none; font-weight: 650; font-size: 12.5px; white-space: nowrap; }
  .barsum em { font-style: normal; color: var(--ink-3); font-weight: 550; margin-left: 4px; }
  .bar-mode .barsum { display: block; }
  .bar-mode .panel { border-radius: 14px; border-width: min(var(--frame-w), 3px); outline: none; }
  .bar-mode header { margin: 0 !important; }
  .bar-mode .panel::before { display: none; }

  /* project switcher (the "main menu") */
  .switch {
    display: flex; align-items: center; gap: 7px; min-width: 0; height: 30px; padding: 0 8px 0 4px; margin-left: -6px; border: 0; border-radius: 9px;
    background: none; cursor: pointer; font-weight: 650; font-size: 12.5px; color: var(--ink); white-space: nowrap;
  }
  .switch:hover { background: rgba(127,127,127,.14); }
  .switch img { width: 18px; height: 18px; border-radius: 5px; flex: none; }
  .switch .lbl { overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
  .switch svg.i { width: 14px; height: 14px; color: var(--ink-3); }
  :root:not([data-material=paper]) header .switch, :root:not([data-material=paper]) header .switch svg.i { color: var(--bar-ink); }
  .bar-mode .switch .lbl, .bar-mode .switch svg.i { display: none; }
  .popmenu.projects { width: 250px; }
  .popmenu.projects button .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .popmenu.projects button .cnt { color: var(--ink-3); font-size: 11.5px; font-weight: 600; }
  .popmenu.projects button.on { background: var(--clay-soft); }
  .popmenu.projects button .dot { width: 9px; height: 9px; }
  .popmenu.projects .warnico { color: var(--clay); font-size: 11px; font-weight: 700; }
  .popmenu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
  .popmenu .head { padding: 4px 10px 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

  /* quick add */
  .quickadd { position: relative; display: flex; gap: 6px; padding: 0 12px 10px; flex: none; }
  .quickadd input {
    flex: 1; min-width: 0; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface);
    font-size: 12.5px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .quickadd input:focus { border-color: var(--clay); box-shadow: 0 0 0 3px color-mix(in srgb, var(--clay) 18%, transparent); }
  .quickadd button { height: 34px; width: 34px; padding: 0; justify-content: center; }
  .bar-mode .quickadd, .bar-mode .warnline { display: none; }
  .warnline { position: relative; margin: 0 12px 10px; padding: 8px 11px; border-radius: 10px; font-size: 11.5px; line-height: 1.4; color: var(--ink-2); background: var(--clay-soft); flex: none; }
  /* size lock + resize grip (bottom-right corner) */
  .corner { pointer-events: none; -webkit-app-region: no-drag; position: absolute; right: 0; bottom: 0; width: 64px; height: 42px; z-index: 5; display: flex; align-items: flex-end; justify-content: flex-end; gap: 2px; padding: 0 3px 3px 0; }
  .lockbtn {
    width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border-radius: 9px; border: 1px solid var(--line-2);
    background: var(--surface); color: var(--ink-2); cursor: pointer; box-shadow: var(--shadow-sm);
    opacity: 0; transform: scale(.7); pointer-events: none; transition: opacity .2s, transform .2s cubic-bezier(.2,.8,.2,1);
  }
  .lockbtn svg.i { width: 15px; height: 15px; }
  .lockbtn:hover { color: var(--ink); border-color: var(--clay); }
  .corner.arming .lockbtn { opacity: .35; transform: scale(.92); transition: opacity 3s linear, transform 3s linear; }
  .corner.show .lockbtn, .unlocked .lockbtn { opacity: 1; transform: none; pointer-events: auto; }
  .unlocked .lockbtn { color: var(--clay); }
  .grip { display: none; width: 16px; height: 16px; margin-bottom: 1px; cursor: nwse-resize; border-radius: 0 0 9px 0;
    background: linear-gradient(135deg, transparent 0 52%, var(--ink-3) 52% 58%, transparent 58% 68%, var(--ink-3) 68% 74%, transparent 74% 84%, var(--ink-3) 84% 90%, transparent 90%); }
  .unlocked .grip { display: block; pointer-events: auto; }
  .unlocked .panel { box-shadow: 0 0 0 2px color-mix(in srgb, var(--clay) 45%, transparent); }
  .bar-mode .corner { display: none; }
  .mecard { display: flex; flex-direction: column; gap: 7px; margin: 0 12px 10px; padding: 11px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-2); flex: none; font-size: 12px; }
  .mecard .hint { color: var(--ink-3); font-size: 11px; line-height: 1.35; }
  .mecard .box { height: 32px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); font: inherit; outline: none; }
  .mecard .box:focus { border-color: var(--clay); }
  .mecard .row { display: flex; justify-content: flex-end; gap: 6px; }
  .bar-mode .mecard { display: none; }
  .empty.welcome { gap: 8px; }
  .empty.welcome .btn { margin-top: 6px; }
  .warnline button { border: 0; background: none; padding: 0; color: var(--clay); font-weight: 650; cursor: pointer; text-decoration: underline; }
  .card .upd { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; color: var(--t-info); font-weight: 600; }
  .card .upd svg.i { width: 12px; height: 12px; }
</style>
</head>
<body>
  <div class="panel">
    <header class="drag">
      <button class="switch" id="switch" title="Switch project, or add one"><img src="../../assets/icon.png" alt=""><span class="lbl" id="pname">Task Desk</span><span id="pchev"></span></button>
      <div class="barsum" id="barsum"></div>
      <span class="pill mode-test" id="mode" hidden>TEST</span>
      <div class="sp"></div>
      <button class="iconbtn" id="copyfor" title="Copy instructions for another AI chat (Claude Code, Codex…) so it works with Task Desk"></button>
      <button class="iconbtn" id="look" title="Customize the look (themes and frames)"></button>
      <button class="iconbtn" id="collapse" title="Collapse to a slim bar"></button>
      <button class="iconbtn" id="menu" title="Menu"></button>
      <button class="iconbtn" id="hide" title="Put away (Ctrl+Alt+T). Click Task Desk on the taskbar or the tray icon to bring it back."></button>
    </header>
    <section class="hero drag">
      <div class="hello" id="hello"></div>
      <div class="big"><b id="count">…</b><span id="mins"></span></div>
      <div class="meter"><div class="bar"><i id="prog" style="width:0"></i></div><span id="progtxt"></span></div>
    </section>
    <div class="warnline" id="warn" hidden></div>
    <nav class="chips" id="chips"></nav>
    <form class="quickadd" id="quickadd" hidden><input id="qtext" maxlength="1000" autocomplete="off"><button class="btn primary" type="submit" id="qadd" title="Add this task"></button></form>
    <main class="list" id="list"></main>
    <footer><span id="updated">Loading…</span><button class="aipick" id="aipick" title="Default AI for task chats and plans"></button><span class="keys"><kbd>Ctrl</kbd> <kbd>Alt</kbd> <kbd>T</kbd></span></footer>
    <!-- Hold the mouse here for 3 seconds: a lock appears that frees or fixes the box's size. -->
    <div class="corner" id="corner"><button class="lockbtn" id="lockbtn"></button><div class="grip" id="grip" title="Drag to resize"></div></div>
  </div>
  <canvas id="badge" width="32" height="32" hidden></canvas>
  <script src="liveframe.js"></script>
  <script src="ui.js"></script>
  <script src="box.js"></script>
</body>
</html>
