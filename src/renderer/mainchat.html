<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Main chat</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
<style>
  /* A project's main chat: the user's own Claude Code session, the whole window wide. */
  body { display: flex; flex-direction: column; background: var(--frame); background-color: var(--bg-2); padding: var(--frame-w); animation: var(--frame-anim); }
  .titlebar { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 6px 0 14px; flex: none; border-bottom: 1px solid var(--line); background: var(--bg-2); }
  .titlebar .tile { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: linear-gradient(140deg, var(--clay-2), var(--clay)); color: #fff; }
  .titlebar .tile svg.i { width: 13px; height: 13px; }
  .titlebar .name { font-weight: 600; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titlebar .sp { flex: 1; }
  :root:not([data-material=paper]):not([data-material=neon]) .titlebar { background: transparent; border-bottom: 0; }
  :root:not([data-material=paper]) .titlebar .name, :root:not([data-material=paper]) .titlebar .iconbtn { color: var(--bar-ink); }
  :root:not([data-material=paper]) .titlebar .iconbtn:not(.close):hover { background: rgba(127,127,127,.2); }
  :root[data-material=neon] .titlebar { border-radius: var(--app-r) var(--app-r) 0 0; margin-bottom: 3px; }
  .chat { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 12px; background: var(--bg-2); border-radius: var(--app-r); box-shadow: var(--frame-glow); outline: var(--stitch); outline-offset: 4px; }
  .chatcard { flex: 1; display: flex; flex-direction: column; min-height: 0; border-radius: 16px; border: 1px solid var(--line-2); background: var(--term-bg); box-shadow: var(--shadow); overflow: hidden; position: relative; }
  .chead { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--line); flex: none; }
  .avatar { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(140deg, var(--clay-2), var(--clay)); color: #fff; flex: none; }
  .avatar svg.i { width: 16px; height: 16px; stroke-width: 1.6; fill: rgba(255,255,255,.25); }
  .cwho { flex: 1; min-width: 0; }
  .cwho b { display: block; font-size: 13px; font-weight: 650; }
  .cstat { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cstat .dot { background: var(--ink-3); }
  .cstat.live .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .cstat.connecting .dot { background: var(--t-research); animation: pulse 1s infinite; }
  .term { flex: 1; min-height: 0; min-width: 0; overflow: hidden; padding: 12px 6px 6px 16px; }
  .term .xterm-viewport { background: transparent !important; }
  .term .xterm-viewport::-webkit-scrollbar-thumb { background: var(--line-2); }
  .cfoot { padding: 8px 14px 10px; font-size: 11px; color: var(--ink-3); border-top: 1px solid var(--line); flex: none; }
  .overlay { position: absolute; inset: 52px 0 0 0; display: grid; place-items: center; background: color-mix(in srgb, var(--term-bg) 88%, transparent); backdrop-filter: blur(3px); z-index: 5; overflow-y: auto; padding: 20px; }
  .overlay .inner { max-width: 560px; width: 100%; color: var(--ink-2); }
  .overlay b.t { display: block; font-family: var(--serif); font-weight: 500; font-size: 20px; color: var(--ink); margin-bottom: 6px; text-align: center; }
  .overlay p { text-align: center; margin: 0 0 14px; line-height: 1.5; }
  .sess { display: block; width: 100%; text-align: left; padding: 10px 12px; margin: 0 0 8px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); cursor: pointer; font: inherit; }
  .sess:hover { border-color: var(--clay); }
  .sess .first { display: block; font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .meta { display: block; font-size: 11px; color: var(--ink-3); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .tag { color: var(--clay); font-weight: 650; }
  .overlay .row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
</style>
</head>
<body>
  <div class="titlebar drag">
    <div class="tile" id="ttile"></div>
    <span class="name" id="tname">Main chat</span>
    <div class="sp"></div>
    <button class="iconbtn" id="wlook" title="Customize the look (themes and frames)"></button>
    <button class="iconbtn" id="wmin" title="Minimize"></button>
    <button class="iconbtn" id="wmax" title="Maximize"></button>
    <button class="iconbtn close" id="wclose" title="Close (the conversation is saved and resumes next time)"></button>
  </div>
  <section class="chat">
    <div class="chatcard">
      <div class="chead">
        <div class="avatar" id="avatar"></div>
        <div class="cwho"><b>Claude Code · main chat</b><div class="cstat" id="cstat"><span class="dot"></span><span id="cstatText">Looking for your main chat…</span></div></div>
        <button class="btn sm ghost" id="cother" title="Pick which of your Claude Code sessions is this project's main chat"></button>
        <button class="btn sm ghost" id="cnew" title="Start a new main chat in the project's folder"></button>
      </div>
      <div class="term" id="term"></div>
      <div class="overlay" id="overlay" hidden></div>
      <div class="cfoot" id="cfoot">Your own Claude Code session for this project, the one that writes your tasks, with your normal Claude Code settings. If it's also open in a terminal, close it there first.</div>
    </div>
  </section>
  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="liveframe.js"></script>
  <script src="ui.js"></script>
  <script src="mainchat.js"></script>
</body>
</html>
